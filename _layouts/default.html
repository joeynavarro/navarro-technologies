<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c3554">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title | escape }} — Practical technology. Personal service.">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.social_image | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/navarro-logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Navarro Technologies home">
      <img src="{{ '/assets/images/navarro-logo.png' | relative_url }}" alt="" width="43" height="49">
      <span>NAVARRO<span>TECHNOLOGIES</span></span>
    </a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="main-nav">Menu <span aria-hidden="true">＋</span></button>
    <nav id="main-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#services">Services</a>
      <a href="{{ '/' | relative_url }}#about">About</a>
      <a href="{{ '/' | relative_url }}#contact">Contact</a>
      <a class="nav-contact" href="{{ site.field_nation_url }}" target="_blank" rel="noopener noreferrer">Field Nation <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer wrap">
    <a class="footer-wordmark" href="{{ '/' | relative_url }}">Navarro Technologies</a>
    <p>Practical technology. Personal service.</p>
    <div><span>© {{ 'now' | date: '%Y' }} Navarro Technologies</span><a href="{{ '/' | relative_url }}#top">Back to top ↑</a></div>
  </footer>
</body>
</html>
